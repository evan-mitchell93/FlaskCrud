{% extends 'base.html' %}
{% block title %} Add Review {% endblock %}
{% block body %}
<div class="container">
    <h3>Add Review</h3>
    <form method="POST">
        <div class="mb-3">
            <label for="game_id" class="form-label">Game ID</label>
            <select class="form-control" id="game_id" name="game_id" required>
                {% for game in games %}
                    <option value="{{ game.id }}">{{ game.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="review" class="form-label">Review</label>
            <textarea class="form-control" id="review" name="review" required></textarea>
        </div>
        <div class="mb-3">
            <label for="rating" class="form-label">Rating</label>
            <input type="number" class="form-control" id="rating" name="rating" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="completed" name="completed">
            <label class="form-check-label" for="completed">Completed</label>
        </div>
        <div class="mb-3">
            <label for="platform" class="form-label">Platform</label>
            <input type="text" class="form-control" id="platform" name="platform" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Review</button>
    </form>
</div>
{% endblock %}
